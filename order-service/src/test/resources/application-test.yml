server:
  port: 0

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

    prometheus:
      enabled: false

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    enabled: false