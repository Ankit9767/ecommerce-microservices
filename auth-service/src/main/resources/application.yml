server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  forward-headers-strategy: framework

spring:

  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000


  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    show-sql: true

eureka:

  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

security:
  cors:
    allowed-origins:
      - http://localhost:3000

  proxy:
    enabled: false
    trusted-proxies: []

  brute-force:
    max-failures: 5
    max-ip-failures: 20
    failure-window: 15m
    lock-duration: 15m
    ip-block-duration: 15m

jwt:

  secret: ${JWT_SECRET:MySuperSecretKeyForJwtAuthentication12345678901234567890}

  expiration: ${JWT_EXPIRATION:3600000}

  refresh-expiration: 604800000



management:

  endpoints:

    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}


  endpoint:

    health:
      show-details: always


  tracing:

    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}


    zipkin:

      tracing:

        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:

  level:

    org.springframework.security: TRACE