version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - ecommerce-network

  ########################################################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: always

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - ecommerce-network

  ########################################################

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: always

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - ecommerce-network

  ########################################################

  eureka-server:

    build:
      context: .
      dockerfile: eureka-server/Dockerfile

    container_name: eureka-server

    restart: always

    ports:
      - "8761:8761"

    networks:
      - ecommerce-network

  ########################################################

  product-service:

    build:
      context: .
      dockerfile: product-service/Dockerfile

    container_name: product-service

    restart: always

    depends_on:
      - mysql
      - eureka-server

    ports:
      - "8089:8089"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    networks:
      - ecommerce-network

  ######################################################

  cart-service:

    build:
      context: .
      dockerfile: cart-service/Dockerfile

    container_name: cart-service

    restart: always

    depends_on:
      - mysql
      - kafka
      - eureka-server

    ports:
      - "8084:8084"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cart_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network

    ########################################################

  payment-service:

    build:
      context: .
      dockerfile: payment-service/Dockerfile

    container_name: payment-service

    restart: always

    depends_on:
      - mysql
      - kafka
      - eureka-server

    ports:
      - "8086:8086"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network

  ########################################################

  order-service:

    build:
      context: .
      dockerfile: order-service/Dockerfile

    container_name: order-service

    restart: always

    depends_on:
      - mysql
      - kafka
      - eureka-server

    ports:
      - "8088:8088"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network

  ########################################################

  inventory-service:

    build:
      context: .
      dockerfile: inventory-service/Dockerfile

    container_name: inventory-service

    restart: always

    depends_on:
      - mysql
      - kafka
      - eureka-server

    ports:
      - "8083:8083"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network


  ########################################################


  auth-service:

    build:
      context: .
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    restart: always

    depends_on:
      - mysql
      - eureka-server

    ports:
      - "8090:8090"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network

  ########################################################

  api-gateway:

    build:
      context: .
      dockerfile: api-gateway/Dockerfile

    container_name: api-gateway

    restart: always

    depends_on:
      - eureka-server

    ports:
      - "8087:8087"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      MANAGEMENT_TRACING_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    networks:
      - ecommerce-network

