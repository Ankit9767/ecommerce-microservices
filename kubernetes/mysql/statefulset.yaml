apiVersion: apps/v1
kind: StatefulSet

metadata:

  name: mysql

  namespace: ecommerce

spec:

  serviceName: mysql

  replicas: 1

  selector:

    matchLabels:

      app: mysql

  template:

    metadata:

      labels:

        app: mysql

    spec:

      containers:

        - name: mysql

          image: mysql:8.4

          ports:

            - containerPort: 3306

          env:

            - name: MYSQL_ROOT_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: mysql-secret

                  key: MYSQL_ROOT_PASSWORD

          volumeMounts:

            - name: mysql-storage

              mountPath: /var/lib/mysql

  volumeClaimTemplates:

    - metadata:

        name: mysql-storage

      spec:

        accessModes:

          - ReadWriteOnce

        resources:

          requests:

            storage: 5Gi