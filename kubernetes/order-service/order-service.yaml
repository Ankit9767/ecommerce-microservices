apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: ecommerce

spec:

  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:

    metadata:
      labels:
        app: order-service

    spec:

      containers:

        - name: order-service

          image: ecommerce-microservices-order-service:latest

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8088

          envFrom:

            - configMapRef:
                name: order-service-config

            - secretRef:
                name: order-service-secret

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:

            httpGet:

              path: /actuator/health

              port: 8088

            initialDelaySeconds: 30

          livenessProbe:

            httpGet:

              path: /actuator/health

              port: 8088

            initialDelaySeconds: 60