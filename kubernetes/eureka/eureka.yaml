apiVersion: apps/v1
kind: Deployment

metadata:

  name: eureka-server

  namespace: ecommerce

spec:

  replicas: 1

  selector:

    matchLabels:

      app: eureka-server

  template:

    metadata:

      labels:

        app: eureka-server

    spec:

      containers:

        - name: eureka-server

          image: ecommerce-microservices-eureka-server:latest

          imagePullPolicy: Never

          ports:

            - containerPort: 8761

          resources:

            requests:

              cpu: "250m"

              memory: "512Mi"

            limits:

              cpu: "500m"

              memory: "1Gi"

          envFrom:

            - configMapRef:

                name: eureka-config