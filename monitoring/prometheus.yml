global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "api-gateway:8087"

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "order-service:8088"

  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "product-service:8089"

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "payment-service:8086"

rule_files:
  - "alert.rules.yml"