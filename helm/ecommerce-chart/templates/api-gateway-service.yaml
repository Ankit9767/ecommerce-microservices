apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}

spec:

  replicas: {{ .Values.gateway.replicas }}

  selector:
    matchLabels:
      app: api-gateway

  template:

    metadata:
      labels:
        app: api-gateway

    spec:

      containers:

        - name: api-gateway

          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8087

          envFrom:

            - configMapRef:
                name: gateway-config

          resources:

            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:

            httpGet:

              path: /actuator/health

              port: 8087

            initialDelaySeconds: 30

          livenessProbe:

            httpGet:

              path: /actuator/health

              port: 8087

            initialDelaySeconds: 60