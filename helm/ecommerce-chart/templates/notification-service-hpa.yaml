apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: notification-service-hpa
  namespace: {{ .Values.namespace }}

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: notification-service

  minReplicas: 3

  maxReplicas: 5

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 70
