apiVersion: v1
kind: ConfigMap
metadata:
  name: search-service-config
  namespace: {{ .Values.namespace }}

data:
  SERVER_PORT: "8079"

  SPRING_APPLICATION_NAME: search-service

  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,circuitbreakers,circuitbreakerevents,metrics"

  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

  SECURITY_CORS_ALLOWED_ORIGINS: {{ .Values.cors.allowedOrigin | quote }}