apiVersion: apps/v1
kind: Deployment

metadata:
  name: shipping-service
  namespace: {{ .Values.namespace }}

spec:
  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: shipping-service

  template:
    metadata:
      labels:
        app: shipping-service

    spec:
      terminationGracePeriodSeconds: 40

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchExpressions:

                    - key: app

                      operator: In

                      values:

                        - shipping-service

      serviceAccountName: shipping-service

      containers:
        - name: shipping-service

          image: "{{ .Values.shipping.image.repository }}:{{ .Values.shipping.image.tag }}"

          imagePullPolicy: {{ .Values.shipping.image.pullPolicy }}

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: shipping-service-config

            - secretRef:
                name: shipping-service-secret

          resources:
            requests:
              cpu: {{ .Values.shipping.resources.requests.cpu | quote }}
              memory: {{ .Values.shipping.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.shipping.resources.limits.cpu | quote }}
              memory: {{ .Values.shipping.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
