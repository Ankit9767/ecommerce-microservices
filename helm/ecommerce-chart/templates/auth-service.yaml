apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.auth.replicas }}

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      serviceAccountName: auth-service

      containers:
        - name: auth-service

          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"

          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}

          ports:
            - containerPort: 8090

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret

          resources:
            requests:
              cpu: {{ .Values.auth.resources.requests.cpu | quote }}
              memory: {{ .Values.auth.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.auth.resources.limits.cpu | quote }}
              memory: {{ .Values.auth.resources.limits.memory | quote }}

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            failureThreshold: 30
            periodSeconds: 10