apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: zookeeper
  namespace: {{ .Values.namespace }}

spec:
  serviceName: zookeeper

  replicas: {{ .Values.zookeeper.image.replicas }}

  selector:
    matchLabels:
      app: zookeeper

  template:

    metadata:
      labels:
        app: zookeeper

    spec:

      containers:

        - name: zookeeper

          image: "{{ .Values.zookeeper.image.repository }}:{{ .Values.zookeeper.image.tag }}"

          ports:
            - containerPort: 2181

          env:

            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"

            - name: ZOOKEEPER_TICK_TIME
              value: "2000"

            - name: ZOOKEEPER_SYNC_LIMIT
              value: "2"

            - name: ZOOKEEPER_INIT_LIMIT
              value: "5"