apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: {{ .Values.namespace }}
  labels:
    app: zipkin

spec:
  replicas: {{ .Values.zipkin.replicas }}

  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin

    spec:
      containers:
        - name: zipkin

          image: "{{ .Values.zipkin.image.repository }}:{{ .Values.zipkin.image.tag }}"

          imagePullPolicy: {{ .Values.zipkin.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 9411
              protocol: TCP

          resources:
            {{- toYaml .Values.zipkin.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 20
            periodSeconds: 20