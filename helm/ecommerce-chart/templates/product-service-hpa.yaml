apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: product-service-hpa

  namespace: {{ .Values.namespace }}

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: product-service

  minReplicas: 3

  maxReplicas: 5

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 70