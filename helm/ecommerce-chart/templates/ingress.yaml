apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: ecommerce-ingress

  namespace: {{ .Values.namespace }}

spec:

  ingressClassName: nginx

  rules:

    - http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: nginx-service

                port:

                  number: 80