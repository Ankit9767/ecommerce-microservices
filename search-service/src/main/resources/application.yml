server:
  port: ${SERVER_PORT}
  shutdown: graceful

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS}

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  lifecycle:
    timeout-per-shutdown-phase: 30s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: search-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.ecommerce.common.events.ProductEvent


eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}


management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}

  endpoint:
    health:
      show-details: never

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT}


logging:
  pattern:
    level: "%5p [${spring.application.name:},trace=%X{traceId:-},span=%X{spanId:-}]"


security:
  gateway:
    enabled: true

pagination:
  default-page-size: 20
  max-page-size: 100

service:
  security:
    internal-token: ${INTERNAL_SERVICE_TOKEN}