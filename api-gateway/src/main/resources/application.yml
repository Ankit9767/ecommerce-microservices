server:
  port: ${SERVER_PORT}
  shutdown: graceful


spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      rate-limit:
        use-forwarded-for: ${GATEWAY_RATE_LIMIT_USE_FORWARDED_FOR:false}

      routes:

        # Local-based routing
        # - id: auth-service
        #   uri: http://localhost:8090
        #   predicates:
        #     - Path=/api/auth/**

        # - id: product-service
        #   uri: http://localhost:8089
        #   predicates:
        #     - Path=/api/products/**

        # - id: order-service
        #   uri: http://localhost:8088
        #   predicates:
        #     - Path=/api/orders/**

        # - id: payment-service
        #   uri: http://localhost:8086
        #   predicates:
        #     - Path=/api/payments/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504


        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: cartServiceCircuitBreaker
                fallbackUri: forward:/fallback/cart
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/products
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/orders
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@ipKeyResolver}"

            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payments
                statusCodes:
                  - 500
                  - 502
                  - 503
                  - 504

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

      default-filters:
        - name: RequestSize
          args:
            maxSize: 2MB


eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS}
    hostname: ${EUREKA_INSTANCE_HOSTNAME}

  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    gateway:
      access: read-only

    health:
      show-details: when_authorized

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY}

  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT}


logging:
  pattern:
    level: "%5p [${spring.application.name:},trace=%X{traceId:-},span=%X{spanId:-}]"


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

cors:
  allowed-origin: ${SECURITY_CORS_ALLOWED_ORIGINS}