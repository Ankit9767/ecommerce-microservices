server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful


spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      routes:

        # Eureka-based routing
        # - id: auth-service
        #   uri: lb://AUTH-SERVICE
        #   predicates:
        #     - Path=/api/auth/**

        # - id: product-service
        #   uri: lb://PRODUCT-SERVICE
        #   predicates:
        #     - Path=/api/products/**

        # - id: order-service
        #   uri: lb://ORDER-SERVICE
        #   predicates:
        #     - Path=/api/orders/**

        # - id: payment-service
        #   uri: lb://PAYMENT-SERVICE
        #   predicates:
        #     - Path=/api/payments/**

        - id: auth-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        - id: product-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/products

        - id: order-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/orders

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payments

      httpclient:
        connect-timeout: 2000
        response-timeout: 5s


eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}


management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}

  endpoint:
    health:
      show-details: always

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}


logging:
  pattern:
    level: "%5p [${spring.application.name:},trace=%X{traceId:-},span=%X{spanId:-}]"


jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForJwtAuthentication12345678901234567890}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}